# Names of the flow building blocks the plugin offers.
# Visible in Automation > Flow: actions under "Plugin" (modern API) or, as a
# fallback, under "Plugin (Legacy)" - see ServiceProvider.
# Keep every text on one line: PlentyONE does not support a backslash as
# line continuation, the text is cut off there.

enqueueOrder = Queue order for address validation
enqueueOrderHelp = Queues the order for address validation. Useful when you want to decide yourself when the check happens - for example only after the payment came in. During the check, the order sits on the configured start status (default: "3.2 | On hold"), then moves to the target status configured for that outcome (default: the status the order had before it was queued).
