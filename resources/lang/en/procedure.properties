# Names of the flow building blocks the plugin offers.
# Visible in Automation > Flow: actions under "Plugin (Legacy)" (or, once
# available, in the modern action catalogue - see ServiceProvider).

enqueueOrder = Queue order for address validation
enqueueOrderHelp = Queues the order for address validation. Useful when you \
want to decide yourself when the check happens - for example only after the \
payment came in. The action does not touch the order status directly - it \
is briefly set to "on hold" during the check and put back exactly to \
whatever your flow had set it to.
