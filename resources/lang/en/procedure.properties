# Names of the flow building blocks the plugin offers.
# Visible in Automation > Flow: actions under "Plugin" (modern API) or, as a
# fallback, under "Plugin (Legacy)" - see ServiceProvider.
# Keep every text on one line: PlentyONE does not support a backslash as
# line continuation, the text is cut off there.

enqueueOrder = Queue order for address validation
enqueueOrderHelp = Queues the order for address validation. Useful when you want to decide yourself when the check happens - for example only after the payment came in. The action does not touch the order status directly - it is briefly set to "on hold" during the check and put back exactly to whatever your flow had set it to.
