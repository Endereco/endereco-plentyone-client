
# Labels of the plugin settings.
# The keys are written WITHOUT the "Config." prefix.
# The order matches config.json and therefore the display.

apiTab = endereco connection

apiEndpointLabel = Address of the endereco service
apiEndpointTooltip = Stays as it is.
apiKeyLabel = API key
apiKeyTooltip = You request the API key for free at endereco.de.

queueTab = Address validation

processingModeLabel = Processing
processingModeTooltip = Mutes the plugin without disabling it in the plugin \
set: with "Draining" or "Stopped" the plugin's flow action stays usable but \
does nothing - flows using it don't break, unlike with a full disable. \
"Draining" still works off the queue, "Stopped" stops the plugin \
immediately.
processingModeRunning = Normal - orders are queued and worked off
processingModeDraining = Draining - no new orders, and waiting ones still finish checking.
processingModeStopped = Stopped - nothing is queued or worked off anymore
enqueueModeLabel = When should orders be queued for checking?
enqueueModeTooltip = With "right away" every new order is queued for \
address validation immediately after it is created. In this mode you can \
also set up your own flow with the "Queue order for address validation" \
action. That lets you, for example, have an already-checked order \
validated again after a manual address correction. With "only through a \
flow" you decide entirely yourself when that happens - use the same \
action in your own flow.
enqueueModeAutomatic = Right away, when an order comes in (flows can also be used)
enqueueModeManual = Only through a flow that you set up yourself

applyCorrectionLabel = Apply minor corrections automatically
applyCorrectionTooltip = "Minor" means: endereco returns exactly one \
suggestion and only a small, unambiguous error is involved - such as a \
different spelling ("Lindenstraße 5" becoming "Lindenstr. 5"). With this \
ticked the plugin writes such a correction straight into the delivery \
address. Without the tick the plugin changes nothing about the address: \
the check still runs, but the order gets the target status for \
"suggestion(s) available" in the "Order status" tab.

writeCommentsLabel = Write a result comment on the order
writeCommentsTooltip = With the tick set, the plugin leaves a comment on \
the order with the check's result - address status and any suggestion.

commentUserIdLabel = User id for comments
commentUserIdTooltip = The plugin leaves a comment on the order after \
every completed check. Plenty requires a user as the author for that. \
Enter a user id with admin rights here.

statusTab = Order status

startStatusLabel = Status: waiting for address check
startStatusTooltip = Enter the status an order should get when it is \
queued for the check. If the entered status id is empty or does not exist \
on your system, status 3.2 is used instead.

targetCorrectLabel = Target status: address correct
targetCorrectTooltip = Enter the status an order should get once the \
address is confirmed correct, e.g. status "5" ("Shipping release"). "0" \
means: restore the status the order had before the check. If the entered \
status id does not exist on your system, the previous status is restored \
as well.
targetMinorCorrectionLabel = Target status: minor correction applied
targetMinorCorrectionTooltip = Enter the status an order should get once \
a safe, minor correction was applied automatically, e.g. status "5" \
("Shipping release"). "0" means: restore the status the order had before \
the check. If the entered status id does not exist on your system, the \
previous status is restored as well.

targetSuggestionAvailableLabel = Target status: suggestion(s) available
targetSuggestionAvailableTooltip = Enter the status an order should get \
when endereco has one or more correction suggestions that were not \
applied automatically - either because there are several possible \
addresses, because a single suggestion is too uncertain to apply without \
review, or because the "Apply minor corrections automatically" setting in \
the "Address validation" tab is switched off. "0" means: restore the \
status the order had before the check. If the entered status id does not \
exist on your system, the previous status is restored as well.
targetNotFoundLabel = Target status: no address found
targetNotFoundTooltip = Enter the status an order should get when \
endereco could not offer any correction suggestion at all. "0" means: \
restore the status the order had before the check. If the entered status \
id does not exist on your system, the previous status is restored as well.
