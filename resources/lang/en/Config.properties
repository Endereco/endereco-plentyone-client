
# Labels of the plugin settings.
# The keys are written WITHOUT the "Config." prefix.
# The order matches config.json and therefore the display.

apiTab = endereco connection

apiEndpointLabel = Address of the endereco service
apiEndpointTooltip = Normally stays as it is. Only change it if endereco \
explicitly gives you a different address.
apiKeyLabel = API key
apiKeyTooltip = You get the key from endereco. Without a key no address can \
be checked.
maxAttemptsLabel = Attempts when endereco cannot be reached
maxAttemptsTooltip = If the service cannot be reached the order stays in the \
queue and is tried again every five minutes. After the chosen number of \
attempts the plugin gives up, marks the order with "Address-Validation \
failed" and releases it again - so it does not hang forever.
maxAttemptsThree = 3 attempts - a quarter of an hour
maxAttemptsSix = 6 attempts - half an hour
maxAttemptsTwelve = 12 attempts - one hour

queueTab = Address validation

processingModeLabel = Processing
processingModeTooltip = For a safe update or reinstall: choose "Draining" \
first - no new orders get queued, but orders already waiting are still \
worked off by the cron job. Wait until the log shows an empty queue, then \
switch to "Stopped" yourself before running the update. "Stopped" freezes \
both halves right away, even with orders still waiting - for an emergency, \
not the normal update flow.
processingModeRunning = Normal - orders are queued and worked off
processingModeDraining = Draining - no new orders, waiting ones still finish
processingModeStopped = Stopped - nothing is queued or worked off anymore
enqueueModeLabel = When should orders be queued for checking?
enqueueModeTooltip = With "right away" every new order is automatically \
queued for address validation immediately after it is created. In this mode \
you can also set up your own flow with the "Queue order for address \
validation" action - for example to have an already-checked order validated \
again after a manual address correction. An order never lands in the queue \
twice at the same time - the plugin makes sure of that itself, whether \
queueing was triggered automatically or through a flow. With "only through \
a flow" you decide entirely yourself when that happens - use the same \
action in your own flow.
enqueueModeAutomatic = Right away, when an order comes in (flows can also be used)
enqueueModeManual = Only through a flow that I set up myself

commentUserIdLabel = User id for comments
commentUserIdTooltip = When endereco could not correct an address \
automatically, the plugin leaves a comment on the order. Plenty requires a \
backend user as the author for that - enter their numeric id here. Without \
a valid id the comment cannot be written.

applyCorrectionLabel = Apply minor corrections automatically
applyCorrectionTooltip = "Safe" means: endereco returned exactly one \
suggestion and it is only about spelling - "Lindenstraße 5" becoming \
"Lindenstr. 5". With this ticked the plugin writes such a correction \
straight into the delivery address. Without the tick the plugin changes \
nothing about the address: the check still runs, the suggestion lands in \
the order's properties, but the order gets the "suggestion available" \
target status in the "Order status" tab instead of this one. Your \
customer's address in the CRM is never changed, either way.

writeCommentsLabel = Write a result comment on the order
writeCommentsTooltip = With this ticked the plugin leaves a comment on the \
order summarizing what the check found - the address status, any \
suggestion, and the reason when none was found. Without the tick no \
comment is written at all; the result is still visible in the order's \
properties and status.

statusTab = Order status

startStatusLabel = Status from queueing
startStatusTooltip = Order status the order carries from the moment it is \
queued for the address check until a result exists - including the time it \
spends waiting in the queue, not only the actual call to the endereco \
service. If the entered status id is empty or does not exist on your \
system, status 3.2 is used instead.

targetCorrectLabel = Target status: address correct
targetCorrectTooltip = Order status once the address is confirmed correct. \
"0" means: restore the status the order had before the check. If the \
entered status id does not exist on your system, the previous status is \
restored as well.
targetMinorCorrectionLabel = Target status: minor correction applied
targetMinorCorrectionTooltip = Order status once a safe, minor correction \
was applied automatically (see the "Apply minor corrections automatically" \
setting in the "Address validation" tab). "0" means: restore the status \
the order had before the check. If the entered status id does not exist on \
your system, the previous status is restored as well.

targetSuggestionAvailableLabel = Target status: suggestion available
targetSuggestionAvailableTooltip = Order status when endereco has a \
correction suggestion that was not applied automatically - either because \
it is too uncertain to apply without review, or because the "Apply minor \
corrections automatically" setting in the "Address validation" tab is \
switched off. "0" means: restore the status the order had before the \
check. If the entered status id does not exist on your system, the \
previous status is restored as well.
targetMultipleVariantsLabel = Target status: several suggestions available
targetMultipleVariantsTooltip = Order status when endereco found several \
possible addresses and cannot decide between them. "0" means: restore the \
status the order had before the check. If the entered status id does not \
exist on your system, the previous status is restored as well.
targetNotFoundLabel = Target status: no address found
targetNotFoundTooltip = Order status when endereco could not offer any \
correction suggestion at all. "0" means: restore the status the order had \
before the check. If the entered status id does not exist on your system, \
the previous status is restored as well.
targetGaveUpLabel = Target status: address check given up
targetGaveUpTooltip = Order status when endereco could not be reached after \
several attempts and the check was given up. "0" means: restore the status \
the order had before the check. If the entered status id does not exist on \
your system, the previous status is restored as well.
