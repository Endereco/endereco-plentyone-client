
# Labels of the plugin's log entries.
# The keys mirror EnderecoPlentyOneClient\Enums\LogCode.
#
# Every code needs a line here: PlentyONE silently drops an entry below ERROR
# level when its translation is missing. A new code in LogCode without a line in
# this file is therefore invisible.

# --- queueing an order --------------------------------------------------------

orderSkippedNotSalesOrder = Order skipped, not a sales order
orderSkippedManualMode = Order skipped, automatic queueing is disabled
orderSkippedNoAddress = Order not queued, no delivery address
orderQueued = Order queued for address validation
orderReenqueued = Order queued again for address validation
orderAlreadyQueued = Order is already in address validation
orderAlreadyHandled = Order was already handled, not queued again automatically
orderQueueFailed = Order could not be queued
startStatusReverted = Start status reverted, enqueueing failed
orderSkippedNotAccepting = Order skipped, queueing is disabled (draining or fully stopped)
startStatusMissing = Configured status for the check does not exist, using status 3.2 instead

# --- checking an address ---------------------------------------------------------

addressMissing = Order has no delivery address
apiCallFailed = Call to the endereco service failed
orderChecked = Address checked
orderGaveUp = Address validation given up - endereco was unreachable

# --- writing the result -----------------------------------------------------------

correctionApplied = Correction written to the delivery address
correctionKeptBack = Correction available but not applied
correctionFailed = Correction could not be written
statusRestored = Order status restored
targetStatusSet = Configured target status set
statusKept = Order status left unchanged
statusWriteFailed = Order status could not be set
targetStatusMissing = Configured target status does not exist, restoring the previous status instead
tagsUpdated = Order tags updated
tagMissing = Tag could not be found or created
tagCreateFailed = Tag could not be created
commentWritten = Result written to the order as a comment
commentFailed = Comment could not be created
commentUserMissing = Configured comment user id does not exist

# --- order properties -----------------------------------------------------------

propertyWriteFailed = Order properties could not be written
propertyTypeMissing = Order property type missing in the system

# --- master data, created at deploy time -----------------------------------------

tableCreated = Queue table created
tableCreateFailed = Queue table could not be created
tableUpdated = Queue table brought up to date
tableUpdateFailed = Queue table could not be updated
masterDataCreated = Master data of the plugin created
masterDataFailed = Master data of the plugin could not be created

# --- working off the queue ------------------------------------------------------

queueStopped = Run skipped, processing is fully stopped
queueEmpty = Queue is empty
queueRunFinished = Queue run finished
queueRunFailed = Queue run aborted
queueEntryStale = Stale queue entry removed
queueEntryRemoveFailed = Could not remove the queue entry
queueEntryAddFailed = Could not add the queue entry
queueEntryMoveFailed = Could not move the queue entry to its new state

# --- sweeping for orphaned queue rows --------------------------------------------

queueEntryTooOld = Queue row removed for being too old
queueOrphanRemoved = Orphaned queue row removed
queueOrphanSweepFinished = Sweep for orphaned queue rows finished
queueOrphanSweepFailed = Sweep for orphaned queue rows aborted
