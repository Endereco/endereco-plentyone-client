# Namen der Flow-Bausteine, die das Plugin anbietet.
# Sichtbar in Automation > Flow: Aktionen unter „Plugin" (moderne API) oder,
# als Rückfall, unter „Plugin (Legacy)" - siehe ServiceProvider.
# Jeder Text auf einer Zeile: PlentyONE unterstützt keinen Backslash als
# Zeilenfortsetzung, der Text bricht dort ab.

enqueueOrder = Auftrag zur Adressprüfung vormerken
enqueueOrderHelp = Merkt den Auftrag für die Adressprüfung vor. Nützlich, wenn du selbst bestimmen willst, wann geprüft wird - zum Beispiel erst nach dem Zahlungseingang. Während der Prüfung steht der Auftrag auf dem konfigurierten Startstatus (Standard: „3.2 | In Warteposition") und wechselt danach auf den für das Ergebnis konfigurierten Zielstatus (Standard: der Status, den der Auftrag vor dem Vormerken hatte).
