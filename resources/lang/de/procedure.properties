# Namen der Flow-Bausteine, die das Plugin anbietet.
# Sichtbar in Automation > Flow: Aktionen unter „Plugin (Legacy)" (oder,
# sobald verfügbar, im modernen Aktions-Katalog - siehe ServiceProvider).

enqueueOrder = Auftrag zur Adressprüfung vormerken
enqueueOrderHelp = Merkt den Auftrag für die Adressprüfung vor. Nützlich, wenn \
Sie selbst bestimmen wollen, wann geprüft wird - zum Beispiel erst nach dem \
Zahlungseingang. Den Status des Auftrags rührt die Aktion nicht direkt an - \
er wird während der Prüfung kurz auf „In Warteposition" gesetzt und danach \
wieder auf den Stand gebracht, den Ihr Flow gesetzt hatte.
