# Namen der Flow-Bausteine, die das Plugin anbietet.
# Sichtbar in Automation > Flow: Aktionen unter „Plugin" (moderne API) oder,
# als Rückfall, unter „Plugin (Legacy)" - siehe ServiceProvider.
# Jeder Text auf einer Zeile: PlentyONE unterstützt keinen Backslash als
# Zeilenfortsetzung, der Text bricht dort ab.

enqueueOrder = Auftrag zur Adressprüfung vormerken
enqueueOrderHelp = Merkt den Auftrag für die Adressprüfung vor. Nützlich, wenn Sie selbst bestimmen wollen, wann geprüft wird - zum Beispiel erst nach dem Zahlungseingang. Den Status des Auftrags rührt die Aktion nicht direkt an - er wird während der Prüfung kurz auf „In Warteposition" gesetzt und danach wieder auf den Stand gebracht, den Ihr Flow gesetzt hatte.
