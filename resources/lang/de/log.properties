
# Beschriftungen der Log-Einträge des Plugins.
# Die Schlüssel entsprechen EnderecoPlentyOneClient\Enums\LogCode.
#
# Jeder Code braucht hier eine Zeile: PlentyONE verwirft einen Eintrag unterhalb
# von ERROR stillschweigend, wenn seine Übersetzung fehlt. Ein neuer Code in
# LogCode ohne Zeile in dieser Datei ist damit unsichtbar.

# --- Auftrag in die Warteschlange aufnehmen -----------------------------------

orderSkippedNotSalesOrder = Auftrag übersprungen, kein Verkaufsauftrag
orderSkippedManualMode = Auftrag übersprungen, automatisches Einreihen ist deaktiviert
orderSkippedNoAddress = Auftrag nicht eingereiht, keine Lieferadresse vorhanden
orderQueued = Auftrag zur Adressprüfung vorgemerkt
orderReenqueued = Auftrag erneut zur Adressprüfung vorgemerkt
orderAlreadyQueued = Auftrag ist bereits in der Adressprüfung
orderAlreadyHandled = Auftrag wurde bereits geprüft, nicht erneut automatisch eingereiht
orderQueueFailed = Auftrag konnte nicht vorgemerkt werden
startStatusReverted = Start-Status zurückgesetzt, da Einreihen fehlgeschlagen ist
orderSkippedNotAccepting = Auftrag übersprungen, Einreihen ist deaktiviert (Auslaufen lassen oder komplett angehalten)
startStatusMissing = Konfigurierter Status für die Prüfung existiert nicht, Status 3.2 wird stattdessen verwendet

# --- Adresse prüfen -------------------------------------------------------------

addressMissing = Auftrag hat keine Lieferadresse
apiCallFailed = Aufruf des endereco-Dienstes fehlgeschlagen
orderChecked = Adresse geprüft
orderGaveUp = Adressprüfung aufgegeben, endereco war nicht erreichbar

# --- Ergebnis schreiben -------------------------------------------------------

correctionApplied = Korrektur in die Lieferadresse eingetragen
correctionKeptBack = Korrektur vorhanden, aber nicht eingetragen
correctionFailed = Korrektur konnte nicht eingetragen werden
statusRestored = Auftragsstatus wiederhergestellt
targetStatusSet = Konfigurierter Zielstatus gesetzt
statusKept = Auftragsstatus unverändert gelassen
statusWriteFailed = Auftragsstatus konnte nicht gesetzt werden
targetStatusMissing = Konfigurierter Zielstatus existiert nicht, alter Status wird wiederhergestellt
tagsUpdated = Tags des Auftrags aktualisiert
tagMissing = Tag konnte nicht gefunden oder angelegt werden
tagCreateFailed = Tag konnte nicht angelegt werden
commentWritten = Ergebnis als Kommentar am Auftrag hinterlegt
commentFailed = Kommentar konnte nicht angelegt werden
commentUserMissing = Konfigurierte Benutzer-ID für Kommentare existiert nicht

# --- Auftragseigenschaften -----------------------------------------------------

propertyWriteFailed = Auftragseigenschaften konnten nicht geschrieben werden
propertyTypeMissing = Auftragseigenschaft fehlt im System

# --- Stammdaten, beim Deployment angelegt --------------------------------------

tableCreated = Tabelle der Warteschlange angelegt
tableCreateFailed = Tabelle der Warteschlange konnte nicht angelegt werden
tableUpdated = Tabelle der Warteschlange auf aktuellen Stand gebracht
tableUpdateFailed = Tabelle der Warteschlange konnte nicht aktualisiert werden
masterDataCreated = Stammdaten des Plugins angelegt
masterDataFailed = Stammdaten des Plugins konnten nicht angelegt werden

# --- Warteschlange abarbeiten -------------------------------------------------

queueStopped = Lauf übersprungen, Verarbeitung ist komplett angehalten
queueEmpty = Warteschlange ist leer
queueRunFinished = Lauf der Warteschlange beendet
queueRunFailed = Lauf der Warteschlange abgebrochen
queueEntryStale = Verwaiste Zeile aus der Warteschlange entfernt
queueEntryRemoveFailed = Zeile konnte nicht aus der Warteschlange entfernt werden
queueEntryAddFailed = Zeile konnte nicht zur Warteschlange hinzugefügt werden
queueEntryMoveFailed = Zeile konnte nicht auf den neuen Status gesetzt werden

# --- Verwaiste Zeilen in der Warteschlange suchen -------------------------------

queueEntryTooOld = Zeile wegen Alters aus der Warteschlange entfernt
queueOrphanRemoved = Verwaiste Zeile aus der Warteschlange entfernt
queueOrphanSweepFinished = Suche nach verwaisten Zeilen abgeschlossen
queueOrphanSweepFailed = Suche nach verwaisten Zeilen abgebrochen
