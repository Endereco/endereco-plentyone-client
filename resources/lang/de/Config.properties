
# Beschriftungen der Plugin-Einstellungen.
# Die Schlüssel stehen hier OHNE das Präfix "Config.".
# Die Reihenfolge entspricht der in config.json und damit der Anzeige.

apiTab = endereco-Schnittstelle

apiEndpointLabel = Adresse des endereco-Dienstes
apiEndpointTooltip = Bleibt normalerweise unverändert. Ändern Sie den Wert nur, \
wenn endereco Ihnen ausdrücklich eine andere Adresse nennt.
apiKeyLabel = API-Schlüssel
apiKeyTooltip = Den Schlüssel bekommen Sie von endereco. Ohne Schlüssel kann \
keine Adresse geprüft werden.
maxAttemptsLabel = Versuche, wenn endereco nicht erreichbar ist
maxAttemptsTooltip = Ist der Dienst nicht erreichbar, bleibt der Auftrag in der \
Warteschlange und wird alle fünf Minuten erneut versucht. Nach der gewählten \
Anzahl gibt das Plugin auf, markiert den Auftrag mit „Adressprüfung \
fehlgeschlagen" und gibt ihn wieder frei - damit er nicht endlos hängen bleibt.
maxAttemptsThree = 3 Versuche - eine Viertelstunde
maxAttemptsSix = 6 Versuche - eine halbe Stunde
maxAttemptsTwelve = 12 Versuche - eine Stunde

queueTab = Adressprüfung

processingModeLabel = Verarbeitung
processingModeTooltip = Für ein sicheres Update oder eine Neuinstallation: \
Wählen Sie zuerst „Auslaufen lassen" - es werden keine neuen Aufträge mehr \
vorgemerkt, wartende Aufträge werden aber vom Cronjob noch fertig abgearbeitet. \
Warten Sie, bis das Log eine leere Warteschlange zeigt, und wählen Sie danach \
selbst „Komplett anhalten", bevor Sie das Update durchführen. „Komplett \
anhalten" friert beides sofort ein, auch wenn noch Aufträge warten - für den \
Notfall, nicht für den normalen Update-Ablauf.
processingModeRunning = Normal - Aufträge werden vorgemerkt und abgearbeitet
processingModeDraining = Auslaufen lassen - keine neuen Aufträge, wartende werden noch fertig
processingModeStopped = Komplett anhalten - nichts wird mehr vorgemerkt oder abgearbeitet
enqueueModeLabel = Wann sollen Aufträge zur Prüfung vorgemerkt werden?
enqueueModeTooltip = Bei „sofort" wird jeder neue Auftrag unmittelbar nach dem \
Anlegen automatisch zur Adressprüfung vorgemerkt. Zusätzlich können Sie in \
diesem Modus selbst einen Flow mit der Aktion „Auftrag zur Adressprüfung \
vormerken" einrichten - etwa um einen bereits geprüften Auftrag nach einer \
manuellen Adresskorrektur erneut prüfen zu lassen. Ein Auftrag landet dabei \
nie gleichzeitig zweimal in der Warteschlange - das stellt das Plugin selbst \
sicher, egal ob die Vormerkung automatisch oder über einen Flow ausgelöst \
wurde. Bei „über einen Flow" entscheiden Sie selbst, wann das passiert - \
nutzen Sie dazu dieselbe Aktion in Ihrem eigenen Flow.
enqueueModeAutomatic = Sofort, wenn ein Auftrag eingeht (Flows zusätzlich möglich)
enqueueModeManual = Nur über einen Flow, den ich selbst einrichte

commentUserIdLabel = Benutzer-ID für Kommentare
commentUserIdTooltip = Wenn endereco eine Adresse nicht automatisch korrigieren \
konnte, hinterlässt das Plugin einen Kommentar am Auftrag. Dafür braucht Plenty \
einen Backend-Benutzer als Verfasser - tragen Sie hier dessen numerische ID \
ein. Ohne gültige ID kann der Kommentar nicht geschrieben werden.

applyCorrectionLabel = Kleine Korrekturen automatisch übernehmen
applyCorrectionTooltip = „Sicher" heißt: endereco hat genau einen Vorschlag \
und es geht nur um die Schreibweise - etwa „Lindenstraße 5" zu „Lindenstr. 5". \
Solche Korrekturen trägt das Plugin mit Haken direkt in die Lieferadresse ein. \
Ohne Haken ändert das Plugin nichts an der Adresse: die Prüfung läuft \
trotzdem, der Vorschlag steht in den Eigenschaften des Auftrags, der Auftrag \
bekommt aber den Zielstatus für „Korrekturvorschlag vorhanden" im Tab \
„Auftragsstatus", nicht diesen hier. Ihre Kundenadresse im CRM wird nie \
geändert, unabhängig von dieser Einstellung.

writeCommentsLabel = Ergebnis als Kommentar auf dem Auftrag festhalten
writeCommentsTooltip = Mit Haken hinterlässt das Plugin einen Kommentar am \
Auftrag mit dem Ergebnis der Prüfung - Adressstatus, ein eventueller \
Vorschlag, und der Grund, falls nichts gefunden wurde. Ohne Haken wird \
kein Kommentar geschrieben; das Ergebnis bleibt trotzdem in den \
Eigenschaften und dem Status des Auftrags sichtbar.

statusTab = Auftragsstatus

startStatusLabel = Status ab Vormerkung
startStatusTooltip = Auftragsstatus, den der Auftrag ab dem Vormerken zur \
Adressprüfung trägt, bis das Ergebnis feststeht - also auch während er noch \
in der Warteschlange wartet, nicht erst während der eigentlichen Abfrage \
beim endereco-Dienst. Ist die eingetragene Status-ID leer oder auf Ihrem \
System nicht vorhanden, wird ersatzweise Status 3.2 verwendet.

targetCorrectLabel = Zielstatus: Adresse korrekt
targetCorrectTooltip = Auftragsstatus, wenn die Adresse als korrekt bestätigt \
wurde. „0" bedeutet: den Status wiederherstellen, den der Auftrag vor der \
Prüfung hatte. Ist die eingetragene Status-ID auf Ihrem System nicht \
vorhanden, wird ebenfalls der vorherige Status wiederhergestellt.
targetMinorCorrectionLabel = Zielstatus: kleine Korrektur übernommen
targetMinorCorrectionTooltip = Auftragsstatus, wenn eine sichere, kleine \
Korrektur automatisch übernommen wurde (siehe die Einstellung „Kleine \
Korrekturen automatisch übernehmen" im Tab „Adressprüfung"). „0" bedeutet: \
den Status wiederherstellen, den der Auftrag vor der Prüfung hatte. Ist die \
eingetragene Status-ID auf Ihrem System nicht vorhanden, wird ebenfalls der \
vorherige Status wiederhergestellt.

targetSuggestionAvailableLabel = Zielstatus: Korrekturvorschlag vorhanden
targetSuggestionAvailableTooltip = Auftragsstatus, wenn endereco einen \
Korrekturvorschlag hat, dieser aber nicht automatisch übernommen wurde - \
weil er zu unsicher ist, um ihn ohne Prüfung zu übernehmen, oder weil die \
Einstellung „Kleine Korrekturen automatisch übernehmen" im Tab \
„Adressprüfung" ausgeschaltet ist. „0" bedeutet: den Status \
wiederherstellen, den der Auftrag vor der Prüfung hatte. Ist die \
eingetragene Status-ID auf Ihrem System nicht vorhanden, wird stattdessen \
der vorherige Status wiederhergestellt.
targetMultipleVariantsLabel = Zielstatus: mehrere Korrekturvorschläge vorhanden
targetMultipleVariantsTooltip = Auftragsstatus, wenn endereco mehrere \
mögliche Adressen gefunden hat und sich nicht für eine entscheiden kann. \
„0" bedeutet: den Status wiederherstellen, den der Auftrag vor der Prüfung \
hatte. Ist die eingetragene Status-ID auf Ihrem System nicht vorhanden, \
wird stattdessen der vorherige Status wiederhergestellt.
targetNotFoundLabel = Zielstatus: keine Adresse gefunden
targetNotFoundTooltip = Auftragsstatus, wenn endereco keinen \
Korrekturvorschlag machen konnte. „0" bedeutet: den Status wiederherstellen, \
den der Auftrag vor der Prüfung hatte. Ist die eingetragene Status-ID auf \
Ihrem System nicht vorhanden, wird stattdessen der vorherige Status \
wiederhergestellt.
targetGaveUpLabel = Zielstatus: Adressprüfung aufgegeben
targetGaveUpTooltip = Auftragsstatus, wenn endereco nach mehreren Versuchen \
nicht erreichbar war und die Prüfung aufgegeben wurde. „0" bedeutet: den \
Status wiederherstellen, den der Auftrag vor der Prüfung hatte. Ist die \
eingetragene Status-ID auf Ihrem System nicht vorhanden, wird stattdessen \
der vorherige Status wiederhergestellt.
