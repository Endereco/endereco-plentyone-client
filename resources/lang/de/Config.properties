
# Beschriftungen der Plugin-Einstellungen.
# Die Schlüssel stehen hier OHNE das Präfix "Config.".
# Die Reihenfolge entspricht der in config.json und damit der Anzeige.

apiTab = endereco-Schnittstelle

apiEndpointLabel = Adresse des endereco-Dienstes
apiEndpointTooltip = Bleibt unverändert.
apiKeyLabel = API-Schlüssel
apiKeyTooltip = Den API-Schlüssel beantragst du kostenfrei auf endereco.de.

queueTab = Adressprüfung

processingModeLabel = Verarbeitung
processingModeTooltip = Zum Stummschalten des Plugins, ohne es im Plugin-Set \
zu deaktivieren: bei „Auslaufen lassen" oder „Komplett anhalten" bleibt die \
Flow-Aktion des Plugins nutzbar, tut aber nichts - Flows, die diese verwenden, \
brechen dadurch nicht, anders als bei einer vollständigen Deaktivierung. \
„Auslaufen lassen" arbeitet die Warteschlange noch ab, „Komplett anhalten" \
stoppt das Plugin sofort.
processingModeRunning = Normal - Aufträge werden vorgemerkt und abgearbeitet
processingModeDraining = Auslaufen lassen - keine neuen Aufträge und wartende werden noch fertig geprüft.
processingModeStopped = Komplett anhalten - nichts wird mehr vorgemerkt oder abgearbeitet
enqueueModeLabel = Wann sollen Aufträge zur Prüfung vorgemerkt werden?
enqueueModeTooltip = Bei „sofort" wird jeder neue Auftrag unmittelbar nach dem \
Anlegen zur Adressprüfung vorgemerkt. Zusätzlich kannst du in diesem Modus \
selbst einen Flow mit der Aktion „Auftrag zur Adressprüfung vormerken" \
einrichten. Damit kannst du z.B. einen bereits geprüften Auftrag nach einer manuellen \
Adresskorrektur erneut prüfen lassen. Bei „über einen Flow" entscheidest \
du selbst, wann das passiert - nutze dazu dieselbe Aktion in deinem eigenen \
Flow.
enqueueModeAutomatic = Sofort, wenn ein Auftrag eingeht (Flows zusätzlich möglich)
enqueueModeManual = Nur über einen Flow, den du selbst einrichtest

applyCorrectionLabel = Kleine Korrekturen automatisch übernehmen
applyCorrectionTooltip = „Klein" heißt: endereco liefert genau einen Vorschlag \
und nur ein kleiner, eindeutiger Fehler liegt vor - etwa eine andere \
Schreibweise („Lindenstraße 5" zu „Lindenstr. 5"). Solche Korrekturen \
trägt das Plugin mit Haken direkt in die Lieferadresse ein. \
Ohne Haken ändert das Plugin nichts an der Adresse: die Prüfung läuft \
trotzdem, der Auftrag bekommt aber den Zielstatus für \
„Korrekturvorschlag/-vorschläge vorhanden" im Tab „Auftragsstatus".

writeCommentsLabel = Ergebnis als Kommentar am Auftrag festhalten
writeCommentsTooltip = Mit gesetztem Haken hinterlässt das Plugin einen Kommentar am \
Auftrag mit dem Ergebnis der Prüfung - Adressstatus und ein eventueller Vorschlag.

commentUserIdLabel = Benutzer-ID für Kommentare
commentUserIdTooltip = Das Plugin hinterlässt nach jeder abgeschlossenen \
Prüfung einen Kommentar am Auftrag. Dafür benötigt Plenty einen \
Benutzer als Verfasser. Trage hier eine Benutzer-ID mit \
Admin-Rechten ein.

statusTab = Auftragsstatus

startStatusLabel = Status: Warten auf Adressprüfung
startStatusTooltip = Trage hier den Status ein, den ein Auftrag beim \
Einreihen in die Warteschlange zur Prüfung bekommen soll. Ist die \
eingetragene Status-ID leer oder auf deinem System nicht vorhanden, wird \
ersatzweise Status 3.2 verwendet.

targetCorrectLabel = Zielstatus: Adresse korrekt
targetCorrectTooltip = Trage hier den Status ein, den ein Auftrag bekommen \
soll, wenn die Adresse als korrekt bestätigt wurde, z.B. Status "5" \
(Freigabe Versand). „0" bedeutet: den Status wiederherstellen, den der \
Auftrag vor der Prüfung hatte. Ist die eingetragene Status-ID auf deinem \
System nicht vorhanden, wird ebenfalls der vorherige Status \
wiederhergestellt.
targetMinorCorrectionLabel = Zielstatus: kleine Korrektur übernommen
targetMinorCorrectionTooltip = Trage hier den Status ein, den ein Auftrag \
bekommen soll, wenn eine sichere, kleine Korrektur automatisch übernommen \
wurde, z.B. Status "5" (Freigabe Versand). „0" bedeutet: den Status \
wiederherstellen, den der Auftrag vor der Prüfung hatte. Ist die \
eingetragene Status-ID auf deinem System nicht vorhanden, wird ebenfalls \
der vorherige Status wiederhergestellt.

targetSuggestionAvailableLabel = Zielstatus: Korrekturvorschlag/-vorschläge vorhanden
targetSuggestionAvailableTooltip = Trage hier den Status ein, den ein \
Auftrag bekommen soll, wenn endereco einen oder mehrere \
Korrekturvorschläge hat, die nicht automatisch übernommen wurden - weil es \
mehrere mögliche Adressen gibt, weil ein einzelner Vorschlag zu unsicher \
ist, um ihn ohne Prüfung zu übernehmen, oder weil die Einstellung „Kleine \
Korrekturen automatisch übernehmen" im Tab „Adressprüfung" ausgeschaltet \
ist. „0" bedeutet: den Status wiederherstellen, den der Auftrag vor der \
Prüfung hatte. Ist die eingetragene Status-ID auf deinem System nicht \
vorhanden, wird ebenfalls der vorherige Status wiederhergestellt.
targetNotFoundLabel = Zielstatus: keine Adresse gefunden
targetNotFoundTooltip = Trage hier den Status ein, den ein Auftrag \
bekommen soll, wenn endereco keinen Korrekturvorschlag machen konnte. \
„0" bedeutet: den Status wiederherstellen, den der Auftrag vor der Prüfung \
hatte. Ist die eingetragene Status-ID auf deinem System nicht vorhanden, \
wird ebenfalls der vorherige Status wiederhergestellt.
